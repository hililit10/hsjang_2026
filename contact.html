<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>장희승 | Contact</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="main-header">
  <div class="container">
    <h1>장희승</h1>
    <p class="subtitle">광운대학교 건축학과 | Future Architect</p>
  </div>
</header>

<nav class="main-nav">
  <div class="nav-content container">
    <a href="index.html" class="active">Home</a>
    <a href="about.html">About</a>
    <a href="portfolio.html">Portfolio</a>
    <a href="contact.html">Contact</a>
  </div>
</nav>

<main class="container">
  <section class="profile-card">
    <h2>Contact Me</h2>
    <p class="intro-text">협업 제안이나 문의 사항이 있으시다면 아래 채널을 통해 편하게 연락해 주세요!</p>
    
    <div class="contact-channels">
      <div class="channel-box">
        <span class="icon">📧</span>
        <span class="label">이메일</span>
        <a href="mailto:jasmin0570@gmail.com" class="link-btn">jasmin0570@gmail.com</a>
      </div>
      
      <div class="channel-box">
        <span class="icon">💻</span>
        <span class="label">GitHub</span>
        <a href="https://github.com/hililit10/hsjang_2026" target="_blank" rel="noopener noreferrer" class="link-btn">Repository 방문</a>
      </div>
      
      <div class="channel-box">
        <span class="icon">📸</span>
        <span class="label">Instagram</span>
        <a href="https://www.instagram.com/hs.hcaep/" target="_blank" rel="noopener noreferrer" class="link-btn">@hs.hcaep</a>
      </div>
    </div>

    <div class="form-wrapper">
      <h3>✉️ 메시지 남기기</h3>
      <form class="contact-form" onsubmit="return false;">
        <div class="form-group">
          <label for="name">이름</label>
          <input type="text" id="name" placeholder="이름을 입력하세요">
        </div>
        
        <div class="form-group">
          <label for="message">메시지</label>
          <textarea id="message" rows="5" placeholder="메시지를 입력하세요"></textarea>
        </div>
        
        <button type="submit" class="submit-btn">보내기 (형태만 제공)</button>
      </form>
    </div>
  </section>
</main>

<footer>
  <small>&copy; <span id="year">2026</span> 장희승. All rights reserved.</small>
</footer>

<script src="script.js"></script>
</body>
</html>
</html>
